name: Build and Deploy MITS Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Configure SSH
        shell: bash
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"

          if [ -z "${CPANEL_SSH_KEY:-}" ]; then
            echo "ERROR: CPANEL_SSH_KEY secret is missing."
            exit 1
          fi

          printf '%s\n' "$CPANEL_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/cpanel_deploy"
          chmod 600 "$HOME/.ssh/cpanel_deploy"

          echo "Validating SSH private key..."
          ssh-keygen -y -f "$HOME/.ssh/cpanel_deploy" > /dev/null

          echo "Retrieving SSH host key..."
          if ! ssh-keyscan -T 15 -p 22133 mits.edu > "$HOME/.ssh/known_hosts" 2>/dev/null; then
            echo "WARNING: Host key scan failed. Connectivity will be tested separately."
            : > "$HOME/.ssh/known_hosts"
          fi

          chmod 600 "$HOME/.ssh/known_hosts"
          echo "SSH configuration completed."

      - name: Diagnose cPanel connectivity
        shell: bash
        run: |
          echo "=== DNS resolution ==="
          getent ahostsv4 mits.edu || true

          echo "=== Testing cPanel IP: 95.211.237.89 ==="
          if timeout 10 bash -c '</dev/tcp/95.211.237.89/22133'; then
            echo "CPANEL_IP_PORT_OPEN"
          else
            echo "CPANEL_IP_PORT_UNREACHABLE"
          fi

          echo "=== Testing domain: mits.edu ==="
          if timeout 10 bash -c '</dev/tcp/mits.edu/22133'; then
            echo "DOMAIN_PORT_OPEN"
          else
            echo "DOMAIN_PORT_UNREACHABLE"
          fi

      - name: Deploy with rsync
        shell: bash
        run: |
          set -euo pipefail

          SSH_CMD="ssh -i $HOME/.ssh/cpanel_deploy -p 22133 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o ConnectTimeout=30"

          MAX_RETRIES=3

          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "==> Deployment attempt $attempt of $MAX_RETRIES..."

            if rsync -az --checksum \
              -e "$SSH_CMD" \
              dist/ \
              mits@mits.edu:/home/mits/public_html/university/; then
              echo "==> Website deployment succeeded."
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              echo "==> Attempt failed. Retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "ERROR: Website deployment failed after $MAX_RETRIES attempts."
          exit 1

      - name: Deploy root .htaccess
        shell: bash
        run: |
          set -euo pipefail

          SSH_CMD="ssh -i $HOME/.ssh/cpanel_deploy -p 22133 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o ConnectTimeout=30"

          printf 'RewriteEngine On\nRewriteRule ^$ /university/ [R=301,L]\nRewriteCond %%{REQUEST_URI} !^/university/\nRewriteRule ^(.*)$ /university/$1 [R=301,L]\n' > /tmp/root.htaccess

          MAX_RETRIES=3

          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "==> Root .htaccess attempt $attempt of $MAX_RETRIES..."

            if rsync -az \
              -e "$SSH_CMD" \
              /tmp/root.htaccess \
              mits@mits.edu:/home/mits/public_html/.htaccess; then
              echo "==> Root .htaccess deployed successfully."
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              echo "==> Attempt failed. Retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo "ERROR: Root .htaccess deployment failed."
          exit 1
      
      - name: Diagnose external SSH access
        if: always()
        shell: bash
        run: |
          echo "=== DNS ==="
          getent ahostsv4 mits.edu || true

          echo "=== TCP test to server IP ==="
          timeout 8 bash -c '</dev/tcp/95.211.237.89/22133' \
            && echo "IP_REACHABLE" \
            || echo "IP_UNREACHABLE"

          echo "=== TCP test to hostname ==="
          timeout 8 bash -c '</dev/tcp/mits.edu/22133' \
            && echo "HOSTNAME_REACHABLE" \
            || echo "HOSTNAME_UNREACHABLE"
