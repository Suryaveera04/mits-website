<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%mits-logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%mits-logo.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%mits-logo.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="#b30000" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Default SEO (overridden per-page by react-helmet-async) -->
    <title>MITS Madanapalle – NAAC A+ Deemed University, Andhra Pradesh</title>
    <meta name="description" content="Madanapalle Institute of Technology &amp; Science (MITS) – NAAC A+ accredited, UGC-recognised Deemed University in Andhra Pradesh offering B.Tech, M.Tech, MBA and MCA programmes." />
    <meta name="author" content="Madanapalle Institute of Technology &amp; Science" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph defaults -->
    <meta property="og:title" content="MITS Madanapalle – NAAC A+ Deemed University" />
    <meta property="og:description" content="NAAC A+ Accredited | UGC Recognised | AICTE Approved | NBA Accredited | NIRF Ranked" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mits.edu/" />
    <meta property="og:image" content="https://mits.edu/mits-logo.png" />
    <meta property="og:site_name" content="MITS Madanapalle" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MITSMadanapalle" />
    <meta name="twitter:image" content="https://mits.edu/mits-logo.png" />
  </head>
  <body>
    <!-- Handle 404 redirect from cPanel for BrowserRouter deep links -->
    <script>
      (function() {
        var p = new URLSearchParams(window.location.search).get("p");
        if (p) {
          window.history.replaceState(null, "", "/university" + decodeURIComponent(p));
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
